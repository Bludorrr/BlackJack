<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackJack · 游戏场地</title>
<style>
/* ===== 全局：黑白红 ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;font-family:'Courier New','Roboto Mono','Segoe UI',monospace;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:0.8rem 1rem;color:#c8d0d8;user-select:none;-webkit-user-select:none;overflow:hidden}
.game-container{max-width:1600px;width:100%;height:98vh;max-height:98vh;background:#141414;background-image:radial-gradient(circle at 20% 30%,#1f1f1f,#0a0a0a);border-radius:8px;padding:0.8rem 1.5rem 1rem;box-shadow:0 20px 40px -10px #000000ee,inset 0 0 0 1px #3a3a3a;border:1px solid #2a2a2a;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column}
.clearance-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #cc3333;padding-bottom:0.3rem;margin-bottom:0.5rem;flex-wrap:wrap;gap:0.2rem 1rem;flex-shrink:0}
.project-name{font-size:1.2rem;font-weight:700;color:#e8e8e8;letter-spacing:2px;text-shadow:0 0 10px #cc333355}
.project-name span{color:#cc3333}
.project-name small{font-size:.6rem;font-weight:400;color:#666;margin-left:8px}
.clearance-badge{background:#1a1a1a;padding:0.1rem 1rem;border-radius:4px;font-size:.65rem;border:1px solid #cc3333;color:#cc3333;letter-spacing:1px;font-weight:500}
.btn{background:#1f1f1f;border:1px solid #3a3a3a;padding:0.2rem 0.8rem;border-radius:4px;font-weight:500;font-size:.65rem;display:inline-flex;align-items:center;gap:4px;cursor:pointer;transition:.15s ease;color:#c8d0d8;font-family:inherit;box-shadow:0 2px 4px rgba(0,0,0,.4);user-select:none;flex-shrink:0}
.btn:hover{background:#2a2a2a;border-color:#cc3333;color:#f0f4f8}
.btn-primary{background:#cc3333;border-color:#ee5555;color:#0d0d0d;font-weight:600;box-shadow:0 2px 0 #881111}
.btn-primary:hover{background:#dd4444;border-color:#ff6666;color:#0a0a0a}
.btn-outline-dark{background:transparent;border:1px solid #3a3a3a;color:#a0b0b8}
.btn-outline-dark:hover{background:#1a1a1a;border-color:#cc3333}
.section-label{display:flex;align-items:center;gap:8px;color:#ccc;font-size:.85rem;font-weight:500;margin-bottom:0.3rem;border-left:4px solid #cc3333;padding-left:10px;letter-spacing:.5px;text-transform:uppercase;flex-shrink:0}
.meta-tag{font-size:.5rem;background:#1a1a1a;padding:.05rem .6rem;border-radius:4px;color:#888;border:1px solid #333}

/* ===== 主布局：场地左 + 牌堆右 ===== */
.main-layout{display:flex;gap:0.8rem;align-items:flex-start;justify-content:flex-start;flex:1;min-height:0}
.field-section{flex:1;min-width:0;display:flex;flex-direction:column}
.library-section-right{flex:0 0 400px;max-width:400px;border-left:1px solid #2a2a2a;padding-left:0.8rem;height:100%;max-height:100%;display:flex;flex-direction:column}
.library-scroll{flex:1;overflow-y:auto;min-height:0;padding-right:4px}
.library-scroll::-webkit-scrollbar{width:4px}
.library-scroll::-webkit-scrollbar-track{background:#0a0a0a}
.library-scroll::-webkit-scrollbar-thumb{background:#333;border-radius:4px}

/* ===== 场地布局 ===== */
.field-wrapper{display:flex;flex-direction:column;align-items:center;padding:0.1rem 0;flex:1;justify-content:center}
.field-row-wrapper{display:flex;align-items:center;width:100%;max-width:680px;justify-content:center}
.row-label{font-size:.5rem;color:#666;width:50px;text-align:right;padding-right:8px;flex-shrink:0;user-select:none;font-weight:400}
.field-row{display:flex;justify-content:center;gap:5px;margin:2.5px 0;width:100%;min-height:68px}
.field-cell{width:70px;height:95px;background:#0a0a0a;border:2px solid #2a2a2a;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.5rem;color:#555;transition:.15s;position:relative;cursor:default;flex-shrink:0;user-select:none}
.field-cell.drag-over{border-color:#cc3333;background:#1a1a1a;box-shadow:0 0 20px #cc333322}
.field-cell .card-mini{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;text-align:center;font-size:.45rem;color:#d0d8e0;background:#141414;border-radius:3px;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none}
.field-cell .card-mini:active{cursor:grabbing}
.mini-name{font-weight:700;font-size:.55rem;color:#e8e8e8;user-select:none;margin-bottom:1px}
.mini-type{font-size:.4rem;color:#888;user-select:none}
.mini-keywords{font-size:.35rem;color:#666;margin-top:2px;user-select:none}
.field-row.red-zone .field-cell{border-color:#883333}
.field-row.red-zone .field-cell:hover{border-color:#cc3333}
.field-row.blue-zone .field-cell{border-color:#333388}
.field-row.blue-zone .field-cell:hover{border-color:#4466cc}
.border-line{width:100%;max-width:680px;height:2px;background:linear-gradient(90deg,transparent,#cc3333,#cc3333,#4466cc,#4466cc,transparent);margin:2px 0;position:relative}
.border-line::after{content:"▼ 边境线 ▲";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#141414;padding:0 10px;font-size:.38rem;color:#666;letter-spacing:2px;user-select:none}

/* ===== 右侧牌堆 ===== */
.library-header{display:flex;align-items:center;gap:6px;margin-bottom:0.4rem;flex-wrap:wrap;flex-shrink:0}
.library-header input{background:#0a0a0a;border:1px solid #2a2a2a;border-radius:4px;padding:.15rem .7rem;color:#d0d8e0;font-size:.75rem;flex:1;min-width:80px;font-family:inherit;user-select:text}
.library-header input:focus{outline:none;border-color:#cc3333}
.library-drop-hint{border:2px dashed #2a2a2a;border-radius:6px;padding:0.3rem;text-align:center;color:#555;font-size:.6rem;transition:.15s;margin-bottom:0.4rem;flex-shrink:0;user-select:none}
.library-drop-hint.drag-over{border-color:#cc3333;background:#1a1a1a;color:#cc3333}
.drop-icon{font-size:.9rem;user-select:none}
.library-section{margin-bottom:0.4rem}
.library-section-title{font-size:.6rem;color:#888;padding:.1rem .3rem;border-bottom:1px solid #2a2a2a;margin-bottom:.25rem;display:flex;align-items:center;gap:6px;user-select:none}
.count-badge{background:#1a1a1a;padding:0 .4rem;border-radius:4px;font-size:.45rem;color:#666}
.library-grid{display:flex;flex-wrap:wrap;gap:3px;padding:2px 0}
.library-card{background:#141414;border:1px solid #2a2a2a;border-radius:4px;padding:2px 8px;font-size:.65rem;color:#b0b8c0;cursor:grab;transition:.1s;display:flex;align-items:center;gap:4px;user-select:none}
.library-card:hover{border-color:#cc3333;background:#1a1a1a}
.library-card:active{cursor:grabbing}
.lc-type{font-size:.4rem;color:#888;background:#1a1a1a;padding:0 4px;border-radius:4px}
.empty-state{grid-column:1/-1;background:#0d0d0db0;border-radius:4px;padding:.8rem;text-align:center;color:#666;border:1px dashed #2a2a2a;font-size:.7rem;line-height:1.8}
.footer-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.4rem;margin-top:.4rem;padding-top:.4rem;border-top:1px solid #2a2a2a;flex-shrink:0}
.counter-badge{background:#0d0d0d;padding:.1rem 1rem;border-radius:4px;color:#888;font-size:.65rem;border:1px solid #2a2a2a;user-select:none}

/* 拖拽幽灵 */
.drag-ghost{position:fixed;pointer-events:none;z-index:9999;background:#1a1a1a;border:2px solid #cc3333;border-radius:6px;padding:5px 12px;font-size:.7rem;color:#d0d8e0;box-shadow:0 8px 32px rgba(0,0,0,.9);opacity:.92;font-family:'Courier New',monospace;user-select:none;transform:translate(-50%,-50%) scale(1.05);white-space:nowrap}

/* 响应式 */
@media(max-width:1200px){.library-section-right{flex:0 0 320px;max-width:320px;padding-left:.6rem}.field-cell{width:62px;height:85px}.field-row{min-height:62px}}
@media(max-width:1024px){.game-container{height:auto;max-height:none;overflow:auto}.main-layout{flex-direction:column;gap:.8rem}.field-section{width:100%}.library-section-right{flex:1;max-width:100%;border-left:none;border-top:1px solid #2a2a2a;padding-left:0;padding-top:.6rem;height:auto;max-height:300px}.library-scroll{max-height:220px}.field-row-wrapper,.border-line{max-width:100%}body{overflow:auto}}
@media(max-width:700px){.game-container{padding:.6rem}.field-cell{width:50px;height:68px}.mini-name{font-size:.4rem}.mini-type{font-size:.32rem}.row-label{width:36px;font-size:.4rem;padding-right:5px}.field-row{gap:3px;min-height:50px}.library-section-right{max-height:240px}.library-card{font-size:.55rem;padding:2px 5px}}
@media(max-width:480px){.field-cell{width:38px;height:52px}.field-row{gap:2px;min-height:38px}.mini-name{font-size:.3rem}.mini-type{font-size:.25rem}.row-label{width:28px;font-size:.3rem;padding-right:3px}.library-section-right{max-height:180px}.library-card{font-size:.45rem;padding:1px 4px}}
</style>
</head>
<body>
<div class="game-container">
  <!-- 顶部 -->
  <div class="clearance-header">
    <div class="project-name"><span>◆</span> BLACKJACK <small>游戏场地</small></div>
    <div class="clearance-badge">🛡 5级 · 机密</div>
  </div>

  <div style="display:flex;gap:6px;margin-bottom:0.3rem;flex-shrink:0;flex-wrap:wrap;">
    <button class="btn btn-outline-dark" id="backBtn" style="padding:.12rem .6rem;font-size:.6rem;">← 返回主界面</button>
    <button class="btn btn-outline-dark" id="refreshDataBtn" style="padding:.12rem .6rem;font-size:.6rem;">🔄 刷新卡牌</button>
  </div>

  <!-- ===== 主布局：场地左 + 牌堆右 ===== -->
  <div class="main-layout">
    <!-- 左侧：场地 -->
    <div class="field-section">
      <div class="section-label"><span>🏟 游戏场地</span><span class="meta-tag">战场</span></div>
      <div class="field-wrapper" id="fieldWrapper">
        <!-- 第1行：敌方统治者区（红） -->
        <div class="field-row-wrapper">
          <span class="row-label" style="color:#883333;">敌方统治者</span>
          <div class="field-row red-zone" data-row="0">
            <div class="field-cell" data-row="0" data-col="0"></div>
          </div>
        </div>
        <!-- 第2行：敌方区域（红） -->
        <div class="field-row-wrapper">
          <span class="row-label" style="color:#883333;">敌方</span>
          <div class="field-row red-zone" data-row="1">
            <div class="field-cell" data-row="1" data-col="0"></div>
            <div class="field-cell" data-row="1" data-col="1"></div>
            <div class="field-cell" data-row="1" data-col="2"></div>
          </div>
        </div>
        <!-- 第3行：我方区域（蓝） -->
        <div class="field-row-wrapper">
          <span class="row-label" style="color:#4466cc;">我方</span>
          <div class="field-row blue-zone" data-row="2">
            <div class="field-cell" data-row="2" data-col="0"></div>
            <div class="field-cell" data-row="2" data-col="1"></div>
            <div class="field-cell" data-row="2" data-col="2"></div>
          </div>
        </div>
        <!-- 边境线 -->
        <div class="border-line"></div>
        <!-- 第4行：敌方区域（红） -->
        <div class="field-row-wrapper">
          <span class="row-label" style="color:#883333;">敌方</span>
          <div class="field-row red-zone" data-row="3">
            <div class="field-cell" data-row="3" data-col="0"></div>
            <div class="field-cell" data-row="3" data-col="1"></div>
            <div class="field-cell" data-row="3" data-col="2"></div>
          </div>
        </div>
        <!-- 第5行：我方区域（蓝） -->
        <div class="field-row-wrapper">
          <span class="row-label" style="color:#4466cc;">我方</span>
          <div class="field-row blue-zone" data-row="4">
            <div class="field-cell" data-row="4" data-col="0"></div>
            <div class="field-cell" data-row="4" data-col="1"></div>
            <div class="field-cell" data-row="4" data-col="2"></div>
          </div>
        </div>
        <!-- 第6行：我方统治者区（蓝） -->
        <div class="field-row-wrapper">
          <span class="row-label" style="color:#4466cc;">我方统治者</span>
          <div class="field-row blue-zone" data-row="5">
            <div class="field-cell" data-row="5" data-col="0"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧：牌堆（拖回即删除） -->
    <div class="library-section-right">
      <div class="section-label" style="border-left-color:#666;margin-bottom:0.3rem;">
        <span>📚 卡牌库</span><span class="meta-tag">拖拽到场地</span>
      </div>
      <div class="library-header">
        <input type="text" id="searchLibrary" placeholder="搜索卡牌...">
      </div>
      <div class="library-drop-hint" id="dropZone">
        <span class="drop-icon">⬇</span><span>拖回此处删除卡牌</span>
      </div>
      <div class="library-scroll" id="libraryScroll">
        <div id="libraryContainer"><div class="empty-state">加载卡牌数据...</div></div>
      </div>
    </div>
  </div>

  <!-- 底部 -->
  <div class="footer-bar">
    <span class="counter-badge" id="footerCounter">0 张卡牌</span>
    <div>
      <button class="btn btn-outline-dark" id="clearFieldBtn" style="padding:.12rem .6rem;font-size:.6rem;">🗑 清空场地</button>
      <button class="btn btn-primary" id="exportFieldBtn" style="padding:.12rem .6rem;font-size:.6rem;">📋 导出布局</button>
    </div>
  </div>
</div>

<!-- 拖拽幽灵 -->
<div class="drag-ghost" id="dragGhost" style="display:none;"></div>

<script>
(function () {
'use strict';

const STORAGE_KEY = 'blackjack_game_data';          // 与文档页共用
const TYPE_ORDER = ['统治者', '干员', '行动', '平民', '通用'];

const $ = id => document.getElementById(id);
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC[c]);
const cardOf = el => JSON.parse(el.dataset.card);   // 卡牌对象统一以 JSON 存在 data-card 上

const libBox = $('libraryContainer'), searchInput = $('searchLibrary');
const ghost = $('dragGhost'), dropZone = $('dropZone');

/* ===== 卡牌数据（读取文档页自动保存的 localStorage） ===== */
function loadCards() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const d = JSON.parse(raw);
    return Array.isArray(d.cards) ? d.cards : [];
  } catch (e) { console.error('读取卡牌数据失败:', e); return []; }
}

/* ===== 渲染卡牌库 ===== */
function renderLibrary() {
  const cards = loadCards();
  const q = searchInput.value.trim().toLowerCase();
  $('footerCounter').textContent = `${cards.length} 张卡牌`;

  if (!cards.length) {
    libBox.innerHTML = `<div class="empty-state">暂无卡牌数据<br><span style="font-size:.6rem;color:#555;">请先在文档页新增卡牌（自动保存），再点「🔄 刷新卡牌」</span></div>`;
    return;
  }
  const list = q
    ? cards.filter(c => (c.name || '').toLowerCase().includes(q) || (c.type || '').toLowerCase().includes(q))
    : cards;
  if (!list.length) { libBox.innerHTML = `<div class="empty-state">没有匹配的卡牌</div>`; return; }

  const groups = {};
  TYPE_ORDER.forEach(t => groups[t] = []);
  list.forEach(c => groups[TYPE_ORDER.includes(c.type) ? c.type : '通用'].push(c));

  libBox.innerHTML = TYPE_ORDER.filter(t => groups[t].length).map(t => `
    <div class="library-section">
      <div class="library-section-title">${esc(t)} <span class="count-badge">${groups[t].length}</span></div>
      <div class="library-grid">${groups[t].map(c => `
        <div class="library-card" data-card="${esc(JSON.stringify(c))}">
          <span>${esc(c.name)}</span><span class="lc-type">${esc(c.type || '通用')}</span>
        </div>`).join('')}</div>
    </div>`).join('');
}

/* ===== 自定义拖拽（鼠标事件，禁用原生 drag 以避免选中干扰） ===== */
let drag = null;   // { card, cell, from:'field'|'library', moved }

function startDrag(card, cell, from, e) {
  e.preventDefault();
  drag = { card, cell, from, moved: false };
  ghost.textContent = `${card.name} (${card.type || '通用'})`;
  ghost.style.display = 'block';
  moveGhost(e);
  if (cell) cell.style.opacity = '.5';
}
function moveGhost(e) { ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px'; }

function clearHighlights() {
  document.querySelectorAll('.field-cell').forEach(c => c.classList.remove('drag-over'));
  dropZone.classList.remove('drag-over');
}
function overDropZone(e) {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  return !!el && !!el.closest('.library-section-right');
}
function cellUnder(e) {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  return el ? el.closest('.field-cell') : null;
}

function cleanup() {
  if (drag && drag.cell) drag.cell.style.opacity = '1';
  drag = null;
  ghost.style.display = 'none';
  clearHighlights();
}

function placeCard(cell, card) {
  cell.innerHTML = `<div class="card-mini" data-card="${esc(JSON.stringify(card))}">
      <div class="mini-name">${esc(card.name)}</div>
      <div class="mini-type">${esc(card.type || '通用')}</div>
      ${card.keywords && card.keywords.length ? `<div class="mini-keywords">${esc(card.keywords.join(', '))}</div>` : ''}
    </div>`;
}

function endDrag(e) {
  const { card, cell, from } = drag;
  // 拖回右侧牌堆 → 移除
  if (overDropZone(e)) {
    if (from === 'field' && cell) { cell.innerHTML = ''; cell.style.opacity = '1'; }
    return cleanup();
  }
  const target = cellUnder(e);
  if (!target) return cleanup();

  if (target !== cell && target.querySelector('.card-mini') && !confirm('此位置已有卡牌，是否替换？')) return cleanup();

  placeCard(target, card);
  if (from === 'field' && cell && cell !== target) { cell.innerHTML = ''; cell.style.opacity = '1'; }
  cleanup();
}

document.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const mini = e.target.closest('.card-mini');
  if (mini) {
    const cell = mini.closest('.field-cell');
    if (cell) startDrag(cardOf(mini), cell, 'field', e);
    return;
  }
  const chip = e.target.closest('.library-card');
  if (chip) startDrag(cardOf(chip), null, 'library', e);
});

document.addEventListener('mousemove', e => {
  if (!drag) return;
  e.preventDefault();
  drag.moved = true;
  moveGhost(e);
  clearHighlights();
  if (overDropZone(e)) { dropZone.classList.add('drag-over'); return; }
  const target = cellUnder(e);
  if (target && target !== drag.cell) target.classList.add('drag-over');
});

document.addEventListener('mouseup', e => {
  if (!drag) return;
  if (!drag.moved) return cleanup();   // 只是点击，不做任何改动
  endDrag(e);
});
window.addEventListener('blur', () => { if (drag) cleanup(); });
['dragstart', 'dragover', 'drop'].forEach(t => document.addEventListener(t, e => e.preventDefault()));

// 双击场地卡牌移除
document.addEventListener('dblclick', e => {
  const mini = e.target.closest('.card-mini');
  if (mini && confirm('移除此卡牌？')) mini.closest('.field-cell').innerHTML = '';
});

/* ===== 按钮 ===== */
$('clearFieldBtn').addEventListener('click', () => {
  if (!confirm('清空场地所有卡牌？')) return;
  document.querySelectorAll('.field-cell').forEach(c => c.innerHTML = '');
  cleanup();
});

$('exportFieldBtn').addEventListener('click', () => {
  const layout = {};
  document.querySelectorAll('.field-cell').forEach(cell => {
    const mini = cell.querySelector('.card-mini');
    if (mini) layout[`r${cell.dataset.row}c${cell.dataset.col}`] = cardOf(mini);
  });
  const blob = new Blob([JSON.stringify(layout, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `field_layout_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
});

$('refreshDataBtn').addEventListener('click', renderLibrary);
searchInput.addEventListener('input', renderLibrary);
$('backBtn').addEventListener('click', () => {
  if (window.opener && !window.opener.closed) window.close();
  else location.href = 'index.html';
});

renderLibrary();
})();
</script>
</body>
</html>

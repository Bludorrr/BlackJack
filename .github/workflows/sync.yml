name: Sync Data

on:
  # 从网页触发
  repository_dispatch:
    types: [sync-data]
  # 也可以手动触发（用于测试）
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    # 关键：允许写入仓库内容
    permissions:
      contents: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 保存数据
        run: |
          echo '${{ toJson(github.event.client_payload) }}' > data.json
          echo "数据已保存，大小: $(wc -c < data.json) 字节"
          
      - name: 显示数据预览
        run: |
          echo "数据预览:"
          head -c 200 data.json
          echo "..."
          
      - name: 更新 index.html
        run: |
          python .github/workflows/update.py
          
      - name: 检查变更
        id: check_changes
        run: |
          if git diff --quiet index.html; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "没有检测到变更"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "检测到变更"
            git diff --stat index.html
          fi
          
      - name: 提交并推送
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "更新数据 - $(date '+%Y-%m-%d %H:%M:%S')"
          git push
          echo "✅ 已提交并推送更新"
          
      - name: 无变更
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "没有需要提交的变更"

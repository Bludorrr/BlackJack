<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackJack · 机密文档</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;font-family:'Courier New','Roboto Mono',monospace;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:2rem 1.2rem;color:#c8d0d8}
.game-container{max-width:1400px;width:100%;background:#141414;background-image:radial-gradient(circle at 20% 30%,#1f1f1f,#0a0a0a);border-radius:8px;padding:2.2rem 2.5rem 2.5rem;box-shadow:0 20px 40px -10px #000000ee,inset 0 0 0 1px #3a3a3a;border:1px solid #2a2a2a}
.clearance-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #cc3333;padding-bottom:.6rem;margin-bottom:1.8rem;flex-wrap:wrap;gap:.5rem 1rem}
.project-name{font-size:1.7rem;font-weight:700;color:#e8e8e8;letter-spacing:2px;text-shadow:0 0 10px #cc333355}
.project-name span{color:#cc3333}
.project-name small{font-size:.8rem;font-weight:400;color:#666;margin-left:12px}
.clearance-badge{background:#1a1a1a;padding:.2rem 1.2rem;border-radius:4px;font-size:.8rem;border:1px solid #cc3333;color:#cc3333;letter-spacing:1px;font-weight:500}
.btn{background:#1f1f1f;border:1px solid #3a3a3a;padding:.5rem 1.4rem;border-radius:4px;font-weight:500;font-size:.85rem;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:.15s;color:#c8d0d8;font-family:inherit;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.btn:hover{background:#2a2a2a;border-color:#cc3333;color:#f0f4f8}
.btn-primary{background:#cc3333;border-color:#ee5555;color:#0d0d0d;font-weight:600;box-shadow:0 2px 0 #881111}
.btn-primary:hover{background:#dd4444;border-color:#ff6666;color:#0a0a0a}
.btn-outline{background:transparent;border:1px solid #3a3a3a;color:#a0b0b8}
.btn-outline:hover{background:#1a1a1a;border-color:#cc3333}
.btn-sm{padding:.1rem 1rem;font-size:.7rem}
.save-indicator{font-size:.75rem;color:#6a8a7a;padding:.2rem .8rem;border-radius:4px;border:1px solid #2a4a3a;background:#0a1a12;display:inline-flex;align-items:center;gap:6px;transition:.3s}
.save-indicator.saved{color:#8acc8a;border-color:#4a8a5a;background:#0a2a1a}
.save-indicator.dirty{color:#e0b060;border-color:#6a5a2a;background:#1a1408}
.save-indicator.err{color:#dd8888;border-color:#7a3a3a;background:#1a0a0a}
.section-label{display:flex;align-items:center;gap:12px;color:#ccc;font-size:1.1rem;font-weight:500;margin-bottom:1rem;border-left:4px solid #cc3333;padding-left:14px;text-transform:uppercase;flex-wrap:wrap}
.meta-tag{font-size:.65rem;background:#1a1a1a;padding:.1rem .8rem;border-radius:4px;color:#888;border:1px solid #333}
.editable-block{cursor:text;transition:.1s}
.editable-block:hover{background:#1a1a1a55}
.editable-block:focus{outline:2px solid #cc3333;background:#1a1a1a88}
.index-section{background:#0d0d0db0;border-radius:4px;padding:.8rem 1.8rem 1.2rem;margin-bottom:2rem;border:1px solid #2a2a2a;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem .8rem}
.index-title{display:flex;align-items:center;gap:10px;color:#b0b8c0;font-weight:500;font-size:.95rem}
.index-title small{font-size:.7rem;opacity:.6;margin-left:4px}
.index-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.tag-pill{background:#141414;padding:.15rem 1rem .15rem 1.2rem;border-radius:40px;font-size:.75rem;font-weight:500;color:#b0b8c0;border:1px solid #333;cursor:pointer;transition:.1s;display:inline-flex;align-items:center;gap:4px;font-family:inherit;user-select:none}
.tag-pill:hover{background:#1a1a1a;border-color:#cc3333;color:#f0f4f8}
.tag-pill.active{background:#cc3333;border-color:#ee5555;color:#0d0d0d;box-shadow:0 0 16px #cc333355}
.tag-pill .count{background:#0d0d0d;border-radius:40px;padding:0 .5rem;font-size:.65rem;color:#888}
.tag-pill.active .count{background:#1a1a1a;color:#ccc}
.tag-actions{display:inline-flex;margin-left:2px;gap:2px}
.tag-actions button{background:transparent;border:none;color:#666;font-size:.55rem;cursor:pointer;padding:0 3px;border-radius:30px;transition:.1s;font-family:inherit}
.tag-actions button:hover{color:#cc3333;background:#1a1a1a}
.tag-pill.all-tag{background:#2a2a2a;border-color:#cc3333;border-width:2px;font-weight:700;color:#e8e8e8;order:-2;box-shadow:0 0 12px #cc333344}
.tag-pill.all-tag:hover{background:#3a3a3a;border-color:#ee5555}
.tag-pill.all-tag.active{background:#cc3333;border-color:#ff6666;color:#0d0d0d;box-shadow:0 0 20px #cc333366}
.tag-pill.all-tag .count{background:#1a1a1a;color:#aaa}
.tag-pill.all-tag.active .count{background:#0d0d0d;color:#ccc}
.tag-pill.primary-type{border-color:#cc3333;background:#1a1a1a;box-shadow:0 0 10px #cc333322;order:-1}
.tag-pill.primary-type.active{background:#cc3333;border-color:#ee5555;color:#0d0d0d}
.primary-badge{font-size:.5rem;background:#cc3333;padding:.1rem .5rem;border-radius:40px;color:#0d0d0d;margin-left:4px;border:1px solid #ee5555;font-weight:600}
.tag-pill.primary-type.active .primary-badge{background:#0d0d0d;color:#cc3333;border-color:#0d0d0d}
.search-box{display:flex;align-items:center;background:#0a0a0a;border-radius:4px;padding:.1rem .2rem .1rem 1.2rem;border:1px solid #2a2a2a}
.search-box input{background:transparent;border:none;padding:.4rem .5rem;color:#d0d8e0;font-size:.85rem;outline:none;min-width:120px;width:160px;font-family:inherit}
.search-box input::placeholder{color:#555}
.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.8rem;margin-bottom:2rem}
.content-grid.single{grid-template-columns:1fr}
.info-card{background:#0d0d0db0;border-radius:4px;padding:1.2rem 1.4rem;border:1px solid #2a2a2a}
.card-title{font-size:1rem;font-weight:600;color:#ccc;border-bottom:1px solid #2a2a2a;padding-bottom:.3rem;margin-bottom:.6rem}
.card-content{color:#b0b8c0;font-size:.9rem;line-height:1.6}
.card-content ul{list-style:none;padding-left:.5rem}
.card-content ul li::before{content:"▸ ";color:#cc3333}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-bottom:2rem}
.rule-card{background:#0d0d0db0;border-radius:4px;padding:1rem 1.2rem;border:1px solid #2a2a2a;transition:.1s}
.rule-card:hover{border-color:#cc3333}
.rule-card.editing{border-color:#cc3333;box-shadow:0 0 20px #cc333322}
.rule-title{color:#ccc;font-weight:600;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.rule-desc{color:#a0a8b0;font-size:.85rem;line-height:1.5;opacity:.9}
.rule-actions{display:flex;gap:4px;margin-top:6px;justify-content:flex-end}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem;margin-top:.5rem}
.card-item{background:#0d0d0db0;border-radius:4px;padding:1.2rem 1.4rem;border:1px solid #2a2a2a;transition:.15s;display:flex;flex-direction:column}
.card-item:hover{border-color:#cc3333}
.card-item.editing{border-color:#cc3333;box-shadow:0 0 20px #cc333322}
.card-name{font-size:1.2rem;font-weight:700;color:#d0d8e0;border-bottom:1px dashed #2a2a2a;padding-bottom:4px;margin-bottom:4px}
.card-type{font-size:.7rem;background:#1a1a1a;padding:.05rem .9rem;border-radius:4px;color:#a0a8b0;align-self:flex-start;margin-bottom:8px;border:1px solid #2a2a2a}
.card-effect{background:#0a0a0ab0;padding:.6rem .9rem;border-radius:4px;margin:4px 0 6px;border-left:3px solid #cc3333;color:#b8c0c8;font-size:.85rem;line-height:1.6;order:1}
.effect-split{height:1px;background:#2a2a2a;margin:5px 0}
.effect-keyword{color:#cc3333;cursor:help;transition:.1s;border-bottom:1px dashed #cc333355;padding:0 2px}
.effect-keyword:hover{color:#ff5555;border-bottom-color:#cc3333}
.effect-action{color:#6688cc;cursor:help;transition:.1s;border-bottom:1px dashed #6688cc55;padding:0 2px}
.effect-action:hover{color:#88aaff;border-bottom-color:#6688cc}
.card-keywords{display:flex;flex-wrap:wrap;gap:4px 8px;margin:4px 0 8px;order:2}
.keyword-badge{background:#141414;padding:.05rem .7rem;border-radius:40px;font-size:.65rem;font-weight:500;color:#b0b8c0;border:1px solid #333;cursor:help;transition:.1s}
.keyword-badge:hover{background:#1a1a1a;border-color:#cc3333}
.card-flavor{font-style:italic;color:#666;font-size:.75rem;margin-top:4px;padding-top:4px;border-top:1px dotted #2a2a2a;opacity:.7;order:3;cursor:text}
.card-flavor:hover{opacity:1;color:#8899a8}
.card-actions{display:flex;justify-content:flex-end;gap:4px;margin-top:10px;border-top:1px solid #2a2a2a;padding-top:8px;order:4}
.icon-btn{background:transparent;border:none;color:#666;font-size:.85rem;padding:.1rem .6rem;border-radius:4px;cursor:pointer;transition:.1s;font-family:inherit}
.icon-btn:hover{background:#1a1a1a;color:#cc3333}
.icon-btn.danger:hover{background:#2a1a1a;color:#cc3333}
.edit-field{background:#0a0a0a;border:1px solid #2a2a2a;border-radius:4px;padding:.3rem .7rem;color:#d0d8e0;font-size:.85rem;width:100%;margin:2px 0;font-family:inherit}
.edit-field:focus{outline:none;border-color:#cc3333;box-shadow:0 0 10px #cc333322}
.edit-select{background:#0a0a0a;border:1px solid #2a2a2a;border-radius:4px;padding:.3rem .7rem;color:#d0d8e0;font-size:.85rem;width:100%;margin:2px 0;font-family:inherit;cursor:pointer}
.edit-select:focus{outline:none;border-color:#cc3333}
.edit-select option{background:#1a1a1a;color:#d0d8e0}
.edit-keywords-area{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0}
.edit-keyword-select{background:#0a0a0a;border:1px solid #2a2a2a;border-radius:4px;padding:.15rem .7rem;color:#d0d8e0;font-size:.7rem;font-family:inherit;cursor:pointer;flex:1;min-width:80px}
.edit-keyword-select option{background:#1a1a1a;color:#d0d8e0}
.edit-keyword-remove-btn{background:transparent;border:none;color:#cc3333;cursor:pointer;font-size:.7rem;padding:0 4px}
.edit-keyword-remove-btn:hover{color:#ff6666}
.add-keyword-btn{background:transparent;border:1px dashed #666;color:#888;padding:.05rem .6rem;border-radius:4px;font-size:.65rem;cursor:pointer;font-family:inherit;transition:.1s}
.add-keyword-btn:hover{border-color:#cc3333;color:#cc3333}
.empty-state{grid-column:1/-1;background:#0d0d0db0;border-radius:4px;padding:2rem 1.5rem;text-align:center;color:#666;border:1px dashed #2a2a2a}
.footer-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-top:2.2rem;padding-top:1rem;border-top:1px solid #2a2a2a}
.counter-badge{background:#0d0d0d;padding:.15rem 1.6rem;border-radius:4px;color:#888;font-size:.8rem;border:1px solid #2a2a2a}
.footer-actions{display:flex;gap:10px}
.keyword-tooltip{position:fixed;background:#141414;border:1px solid #cc3333;border-radius:4px;padding:.6rem 1rem;max-width:280px;box-shadow:0 12px 30px #000000ee;color:#d0d8e0;font-size:.85rem;line-height:1.5;pointer-events:none;z-index:999;transition:opacity .12s;opacity:0;visibility:hidden}
.keyword-tooltip.visible{opacity:1;visibility:visible}
.tt-title{color:#cc3333;font-weight:600;border-bottom:1px solid #2a2a2a;padding-bottom:3px;margin-bottom:4px}
.tt-desc{color:#a8b0b8}
.multi-select-hint{font-size:.7rem;color:#888;margin-left:6px;font-weight:300}
.clear-selection-btn{background:transparent;border:1px solid #333;color:#888;padding:.1rem .8rem;border-radius:4px;font-size:.7rem;cursor:pointer;font-family:inherit;transition:.1s}
.clear-selection-btn:hover{border-color:#cc3333;color:#cc3333;background:#1a1a1a}
@media(max-width:800px){.content-grid{grid-template-columns:1fr}}
@media(max-width:700px){.game-container{padding:1.2rem}.index-section{flex-direction:column;align-items:stretch}.search-box input{width:100%}.cards-grid{grid-template-columns:1fr}}
@media(max-width:480px){.rules-grid{grid-template-columns:1fr}.project-name{font-size:1.3rem}}
</style>
</head>
<body>
<div class="game-container" id="app">
  <div class="clearance-header">
    <div class="project-name"><span>◆</span> BLACKJACK <small>机密文档</small></div>
    <div class="clearance-badge">🛡 5级 · 机密</div>
  </div>

  <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:1.8rem;flex-wrap:wrap;align-items:center;">
    <span class="save-indicator" id="saveIndicator">● 就绪</span>
    <button class="btn btn-outline" id="publishBtn">📦 生成分享版</button>
    <button class="btn btn-outline" id="resetBtn">↺ 重置为默认</button>
  </div>

  <div class="section-label"><span>📄 游戏简介</span><span class="meta-tag">概述</span></div>
  <div class="content-grid single" style="margin-bottom:1.8rem;">
    <div class="info-card">
      <div class="card-content editable-block" contenteditable="true" data-block="intro" style="padding:.2rem;"></div>
    </div>
  </div>

  <div class="section-label"><span>🏷 卡牌分类</span><span class="meta-tag">主要类型</span></div>
  <div class="content-grid" style="margin-bottom:1.8rem;">
    <div class="info-card">
      <div class="card-title editable-block" contenteditable="true" data-block="type-title-1"></div>
      <div class="card-content editable-block" contenteditable="true" data-block="type-desc-1"></div>
    </div>
    <div class="info-card">
      <div class="card-title editable-block" contenteditable="true" data-block="type-title-2"></div>
      <div class="card-content editable-block" contenteditable="true" data-block="type-desc-2"></div>
    </div>
    <div class="info-card">
      <div class="card-title editable-block" contenteditable="true" data-block="type-title-3"></div>
      <div class="card-content editable-block" contenteditable="true" data-block="type-desc-3"></div>
    </div>
    <div class="info-card">
      <div class="card-title editable-block" contenteditable="true" data-block="type-title-4"></div>
      <div class="card-content editable-block" contenteditable="true" data-block="type-desc-4"></div>
    </div>
  </div>

  <div class="section-label"><span>🏟 游戏场地</span><span class="meta-tag">战场</span></div>
  <div class="content-grid single" style="margin-bottom:1rem;">
    <div class="info-card" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;">
      <div>
        <div style="font-size:1rem;font-weight:600;color:#ccc;margin-bottom:.3rem;">进入游戏场地</div>
        <div style="color:#888;font-size:.85rem;">在标准卡牌比例的场地上部署您的卡牌，支持拖拽操作</div>
      </div>
      <button class="btn btn-primary" id="openFieldBtn" style="padding:.5rem 2rem;">🏟 打开场地</button>
    </div>
  </div>

  <div class="section-label"><span>⚙ 游戏过程</span><span class="meta-tag">流程</span></div>
  <div class="content-grid single" style="margin-bottom:1.8rem;">
    <div class="info-card">
      <div class="card-title editable-block" contenteditable="true" data-block="process-title"></div>
      <div class="card-content editable-block" contenteditable="true" data-block="process-desc"></div>
    </div>
  </div>

  <div class="section-label"><span>🏆 获胜条件</span><span class="meta-tag">目标</span></div>
  <div class="content-grid single" style="margin-bottom:1.8rem;">
    <div class="info-card">
      <div class="card-title editable-block" contenteditable="true" data-block="win-title"></div>
      <div class="card-content editable-block" contenteditable="true" data-block="win-desc"></div>
    </div>
  </div>

  <div class="section-label" style="margin-top:.5rem;">
    <span>📜 游戏规则</span><span class="meta-tag">机制</span>
    <button class="btn btn-outline btn-sm" id="addRuleBtn">+ 新增规则</button>
  </div>
  <div class="rules-grid" id="rulesGrid"></div>

  <div class="section-label">
    <span>🔖 词条索引</span><span class="meta-tag">术语表</span>
    <span class="multi-select-hint">(点击筛选 · Ctrl+点击多选)</span>
    <button class="btn btn-outline btn-sm" id="addKeywordBtn">+ 新增词条</button>
    <button class="clear-selection-btn" id="clearSelectionBtn">清除选择</button>
  </div>
  <div class="index-section">
    <div class="index-title">🏷 词条列表 <small>(点击筛选 · ✎编辑 · 🗑删除)</small></div>
    <div class="index-tags" id="keywordTags"></div>
    <div class="search-box"><input type="text" id="searchInput" placeholder="搜索卡牌..."></div>
  </div>

  <div class="section-label" style="margin-top:.5rem;">
    <span>📚 卡牌列表</span><span class="meta-tag" id="cardCounter">(0 / 0)</span>
    <button class="btn btn-primary btn-sm" id="addCardBtn">+ 新增卡牌</button>
    <button class="btn btn-outline btn-sm" id="clearCardsBtn">🗑 清空</button>
  </div>
  <div class="cards-grid" id="cardsGrid"></div>
  <div style="display:flex;justify-content:flex-end;margin-top:.8rem;gap:8px;">
    <button class="btn btn-primary btn-sm" id="addCardBtnBottom">+ 新增卡牌</button>
  </div>

  <div class="footer-bar">
    <span class="counter-badge" id="footerCounter">0 张卡牌 · 0 条规则</span>
    <div class="footer-actions">
      <button class="btn btn-outline" id="exportBtn">⬇ 导出记录</button>
      <button class="btn btn-outline" id="importBtn">⬆ 导入记录</button>
    </div>
  </div>
  <input type="file" id="importFile" accept="application/json" hidden>
</div>

<div class="keyword-tooltip" id="keywordTooltip">
  <div class="tt-title">ℹ <span id="ttKeyword"></span></div>
  <div class="tt-desc" id="ttDesc"></div>
</div>

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC_MAP[c]);

/* ============================================================
   3. 持久化：自动保存（防抖）+ 读取
   ============================================================ */
let saveTimer = null;

function setIndicator(text, cls) {
  saveIndicator.className = 'save-indicator' + (cls ? ' ' + cls : '');
  saveIndicator.innerHTML = '<span style="font-size:.5rem">●</span> ' + text;
}

function collectEditable() {
  const out = {};
  document.querySelectorAll('[data-block]').forEach(el => { out[el.dataset.block] = el.innerHTML; });
  return out;
}

function currentPayload() {
  return { rules, cards, keywordLibrary: KEYWORDS, editableContent: collectEditable(), exportedAt: new Date().toISOString() };
}

function commit() {                       // 任何改动后调用 → 自动保存
  setIndicator('保存中…', 'dirty');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 400);
}

function saveNow() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentPayload()));
    setIndicator('已自动保存', 'saved');
  } catch (e) {
    console.error('保存失败:', e);
    setIndicator('保存失败（存储不可用）', 'err');
  }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || (!d.cards && !d.rules)) return false;
    applyData(d);
    return true;
  } catch (e) { console.error('读取本地存档失败:', e); return false; }
}

function applyData(d) {
  rules = Array.isArray(d.rules) ? d.rules : [];
  cards = Array.isArray(d.cards) ? d.cards : [];
  KEYWORDS = d.keywordLibrary && typeof d.keywordLibrary === 'object' ? d.keywordLibrary : {};
  const ec = d.editableContent || {};
  document.querySelectorAll('[data-block]').forEach(el => {
    const v = ec[el.dataset.block];
    if (v !== undefined) el.innerHTML = v;
  });
}

function loadDefault() {
  applyData(DEFAULT_DATA);
  // 默认数据的可编辑块以 DEFAULT_DATA 为准
  const ec = DEFAULT_DATA.editableContent || {};
  document.querySelectorAll('[data-block]').forEach(el => {
    const v = ec[el.dataset.block];
    if (v !== undefined) el.innerHTML = v;
  });
}

/* ============================================================
   4. 渲染
   ============================================================ */
const BRACKET_RE = /\[([^\]]+)\]/g;        // 效果文本中的 [词条] 标记

function kwOf(card) {                       // 卡牌可被索引的全部来源：关键词数组 + 类型 + 效果文本
  const s = new Set();
  (card.keywords || []).forEach(k => { k = (k || '').trim(); if (k) s.add(k); });
  const t = (card.type || '').trim();
  if (TYPE_KEYWORDS.includes(t)) s.add(t);
  BRACKET_RE.lastIndex = 0;
  let m;
  while ((m = BRACKET_RE.exec(card.effect || '')) !== null) {
    const k = m[1].trim();
    if (k && KEYWORDS[k]) s.add(k);         // 仅索引词条库中已定义的
  }
  return s;
}

function allKeywords() {
  const s = new Set();
  cards.forEach(c => kwOf(c).forEach(k => s.add(k)));
  Object.keys(KEYWORDS).forEach(k => s.add(k));
  TYPE_KEYWORDS.forEach(k => s.add(k));
  return [...s].sort((a, b) => {
    const ra = BADGE_TYPES.includes(a) ? 0 : 1, rb = BADGE_TYPES.includes(b) ? 0 : 1;
    return ra !== rb ? ra - rb : a.localeCompare(b, 'zh');
  });
}

function keywordCounts() {
  const m = new Map();
  cards.forEach(c => kwOf(c).forEach(k => m.set(k, (m.get(k) || 0) + 1)));
  Object.keys(KEYWORDS).forEach(k => { if (!m.has(k)) m.set(k, 0); });
  TYPE_KEYWORDS.forEach(k => { if (!m.has(k)) m.set(k, 0); });
  return m;
}

function filteredCards() {
  const q = searchText.trim().toLowerCase();
  return cards.filter(c => {
    if (selected.length) { const ks = kwOf(c); for (const k of selected) if (!ks.has(k)) return false; }
    if (q && !(c.name || '').toLowerCase().includes(q) && !(c.effect || '').toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderEffect(text) {
  if (!text) return '';
  return esc(text).split('/////').map(part =>
    part
      .replace(/\[([^\]]+)\]/g, (m, k) =>                                  // [词条] → 高亮 + 悬停释义
        KEYWORDS[k.trim()] ? `<span class="effect-keyword" data-keyword="${k.trim()}">[${k.trim()}]</span>` : m)
      .replace(/&lt;([^&]+)&gt;/g, (m, n) =>                               // <行动> → 高亮 + 悬停释义
        findAction(n.trim()) ? `<span class="effect-action" data-action="${n.trim()}">&lt;${n.trim()}&gt;</span>` : m)
  ).join('<div class="effect-split"></div>');
}

function renderRules() {
  if (!rules.length) { rulesGrid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">ℹ 暂无规则记录</div>'; return; }
  rulesGrid.innerHTML = rules.map(r => {
    if (r.id === editingRuleId) {
      return `<div class="rule-card editing" data-id="${r.id}">
        <input class="edit-field" value="${esc(r.title)}" data-edit-rule="title" placeholder="规则标题">

    return `<div class="rule-card" data-id="${r.id}">

      <div class="rule-desc">${esc(r.description)}</div>

    </div>`;
  }).join('');
}

function renderTags() {
  const list = allKeywords(), counts = keywordCounts();
  const allActive = !selected.length && !searchText.trim();
  let html = `<span class="tag-pill all-tag ${allActive ? 'active' : ''}" data-keyword="__all">【全部】 <span class="count">${cards.length}</span></span>`;
  html += list.map(k => {
    const isPrimary = BADGE_TYPES.includes(k);
    return `<span class="tag-pill ${selected.includes(k) ? 'active' : ''} ${isPrimary ? 'primary-type' : ''}" data-keyword="${esc(k)}" title="${esc(KEYWORDS[k] || '未定义')}">${esc(k)} ${isPrimary ? '<span class="primary-badge">主要</span>' : ''} <span class="count">${counts.get(k) || 0}</span>
      <span class="tag-actions"><button class="tag-edit-btn" data-keyword="${esc(k)}" title="编辑词条">✎</button><button class="tag-delete-btn" data-keyword="${esc(k)}" title="删除词条">🗑</button></span></span>`;
  }).join('');
  keywordTags.innerHTML = html;
}

function renderCards() {
  const list = filteredCards();
  if (!list.length) {
    cardsGrid.innerHTML = `<div class="empty-state">🃏 ${cards.length ? '无匹配卡牌，调整筛选条件' : '暂无卡牌记录，点击 “新增卡牌” 创建'}</div>`;
    return;
  }
  cardsGrid.innerHTML = list.map(card => {
    if (card.id === editingCardId) {
      const typeOpts = CARD_TYPES.map(t => `<option${card.type === t ? ' selected' : ''}>${esc(t)}</option>`).join('');
      const kwOpts = Object.keys(KEYWORDS).sort((a, b) => a.localeCompare(b, 'zh'))
        .map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('');
      const tags = (card.keywords || []).map(k =>
        `<span class="keyword-badge" style="cursor:default">${esc(k)}<button class="edit-keyword-remove-btn" data-remove-keyword="${esc(k)}" title="移除">✕</button></span>`).join('');
      return `<div class="card-item editing" data-id="${card.id}">
        <input class="edit-field" value="${esc(card.name)}" data-edit="name" placeholder="卡牌名称">
        <select class="edit-select" data-edit="type">${typeOpts}</select>
        <textarea class="edit-field" rows="3" data-edit="effect" placeholder="效果描述（用 [词条] 标记，///// 分段）">${esc(card.effect)}</textarea>
        <div class="edit-keywords-area">${tags}<select class="edit-keyword-select" data-add-keyword><option value="">— 添加词条 —</option>${kwOpts}</select></div>
        <input class="edit-field" value="${esc(card.flavor)}" data-edit="flavor" placeholder="背景故事">
        <div class="card-actions"><button class="icon-btn" data-action="save-edit">💾 完成</button><button class="icon-btn" data-action="cancel-edit">✕ 取消</button></div>
      </div>`;
    }
    return `<div class="card-item" data-id="${card.id}">
      <div class="card-name">${esc(card.name)}</div>
      <div class="card-type">${esc(card.type)}</div>
      <div class="card-effect">${renderEffect(card.effect)}</div>
      <div class="card-keywords">${(card.keywords || []).map(k => `<span class="keyword-badge" data-keyword="${esc(k.trim())}">${esc(k.trim())}</span>`).join('')}</div>
      <div class="card-flavor" title="双击编辑背景故事">${esc(card.flavor)}</div>
      <div class="card-actions"><button class="icon-btn" data-action="edit">✎ 编辑</button><button class="icon-btn" data-action="duplicate" title="复制">📋 复制</button><button class="icon-btn danger" data-action="delete" title="删除">🗑 删除</button></div>
    </div>`;
  }).join('');
}

function updateCounters() {
  cardCounter.textContent = `(${filteredCards().length} / ${cards.length})`;
  footerCounter.textContent = `${cards.length} 张卡牌 · ${rules.length} 条规则`;
}

function renderAll() { renderRules(); renderTags(); renderCards(); updateCounters(); }

/* ============================================================
   5. 词条提示气泡
   ============================================================ */
function showTooltip(e, el) {          // el 带 data-keyword（词条）或 data-action（行动）
  const kw = el.dataset.keyword, act = el.dataset.action;
  if (act) {
    const c = findAction(act);
    ttKeyword.textContent = `<${act}> · 行动`;
    ttDesc.textContent = c ? c.effect.replace(/\/{5}/g, ' / ') : '未找到同名行动卡。';
  } else {
    ttKeyword.textContent = kw;
    ttDesc.textContent = KEYWORDS[kw] || '未定义词条效果，请编辑词条库。';
  }
  tooltip.classList.add('visible');
  moveTooltip(e);
}
function moveTooltip(e) {
  let x = e.clientX + 16, y = e.clientY - 10;
  if (x + 300 > window.innerWidth) x = e.clientX - 290;
  if (y + 130 > window.innerHeight) y = window.innerHeight - 140;
  if (y < 10) y = 10;
  tooltip.style.left = x + 'px'; tooltip.style.top = y + 'px';
}
const hideTooltip = () => tooltip.classList.remove('visible');

/* ============================================================
   6. 操作
   ============================================================ */
function findCard(id) { return cards.find(c => c.id === id); }
function findRule(id) { return rules.find(r => r.id === id); }
function findAction(name) {   // 按名字查找「行动」卡，供 <行动> 悬停时显示效果
  return cards.find(c => (c.type || '').trim() === '行动' && (c.name || '').trim() === name);
}

function addCard() {
  const c = { id: uid(), name: '新卡牌', type: '通用', effect: '描述卡牌效果……', flavor: '“背景故事”', keywords: [] };
  cards.push(c); editingCardId = c.id; renderAll(); commit();
  setTimeout(() => { const el = cardsGrid.querySelector('.card-item.editing'); el && el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50);
}
function deleteCard(id) {
  const i = cards.findIndex(c => c.id === id); if (i < 0) return;
  if (!confirm(`删除卡牌 “${cards[i].name}” ？`)) return;
  cards.splice(i, 1);
  if (editingCardId === id) editingCardId = null;
  renderAll(); commit();
}
function duplicateCard(id) {
  const o = findCard(id); if (!o) return;
  cards.push({ ...o, id: uid(), name: o.name + ' (复刻)', keywords: [...(o.keywords || [])] });
  renderAll(); commit();
}
function addRule() {
  const r = { id: uid(), title: '新规则', description: '描述规则内容……' };
  rules.push(r); editingRuleId = r.id; renderAll(); commit();
}
function deleteRule(id) {
  const i = rules.findIndex(r => r.id === id); if (i < 0) return;
  if (!confirm(`删除规则 “${rules[i].title}” ？`)) return;
  rules.splice(i, 1);
  if (editingRuleId === id) editingRuleId = null;
  renderAll(); commit();
}
function addKeywordToCard(cardId, kw) {
  const c = findCard(cardId); if (!c || !kw) return;
  c.keywords = c.keywords || [];
  if (!c.keywords.includes(kw)) c.keywords.push(kw);
  renderAll(); commit();
}
function removeKeywordFromCard(cardId, kw) {
  const c = findCard(cardId); if (!c) return;
  c.keywords = (c.keywords || []).filter(k => k !== kw);
  renderAll(); commit();
}
function addKeyword() {
  const n = prompt('请输入新词条的名称：'); if (!n || !n.trim()) return;
  const t = n.trim();
  if (KEYWORDS[t]) { alert(`词条 “${t}” 已存在！`); return; }
  const d = prompt(`请输入词条 “${t}” 的效果描述：`, '（请描述该词条的效果）');
  if (d !== null) { KEYWORDS[t] = d.trim() || '（未定义效果）'; renderAll(); commit(); }
}
function editKeyword(kw) {
  const d = prompt(`编辑词条 “${kw}” 的效果描述：`, KEYWORDS[kw] || '');
  if (d !== null) { KEYWORDS[kw] = d.trim() || '（未定义效果）'; renderAll(); commit(); }
}
function deleteKeyword(kw) {
  if (!confirm(`确定要删除词条 “${kw}” 吗？\n（将从词条库移除，并同步从所有卡牌中去掉该词条）`)) return;
  delete KEYWORDS[kw];
  cards.forEach(c => {
    if (c.keywords) c.keywords = c.keywords.filter(k => k.trim() !== kw);
    if ((c.type || '').trim() === kw) c.type = '通用';
  });
  selected = selected.filter(k => k !== kw);
  renderAll(); commit();
}
function clearCards() {
  if (!cards.length) return;
  if (!confirm('删除所有卡牌？（规则保留）')) return;
  cards = []; selected = []; searchText = ''; searchInput.value = ''; editingCardId = null;
  renderAll(); commit();
}
function resetDefault() {
  if (!confirm('重置为内嵌默认数据？当前所有修改将被覆盖。')) return;
  loadDefault(); selected = []; searchText = ''; searchInput.value = ''; editingCardId = editingRuleId = null;
  renderAll(); saveNow();
}
function exportData() {
  const blob = new Blob([JSON.stringify(currentPayload(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `blackjack_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
}
// 把当前数据烤进 HTML 源码，导出一个可直接分发的独立文件
async function publishStandalone() {
  try {
    const src = await (await fetch(location.href, { cache: 'no-store' })).text();
    const RE = /\/\*__DATA__\*\/[\s\S]*?\/\*__\/DATA__\*\//;
    if (!RE.test(src)) { alert('❌ 源码中未找到数据标记，无法生成分享版。'); return; }
    if (!confirm('生成分享版 HTML？\n\n导出的文件已包含当前全部卡牌 / 规则 / 词条 / 文案，对方双击打开即可看到。\n之后你再修改，需要重新生成并发送一次。')) return;

    const data = currentPayload();
    delete data.exportedAt;
    const json = JSON.stringify(data, null, 2).replace(/<\/script/gi, '<\\/script');
    const out = src.replace(RE, '/*__DATA__*/' + json + '/*__/DATA__*/');

    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([out], { type: 'text/html;charset=utf-8' }));
    a.download = `blackjack_share_${new Date().toISOString().slice(0, 10)}.html`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    alert('✅ 分享版已生成。\n\n建议把它重命名为 index.html，和 field.html 放在同一个文件夹里一起发送：\n· 这样对方的场地页才能读到卡牌\n· 场地页的「← 返回主界面」按钮才能跳回来');
  } catch (e) {
    alert('❌ 生成失败：' + e.message + '\n\n请通过本地服务器打开本页（node server.js → http://localhost:5173）；\n直接双击 file:// 打开时，浏览器会禁止页面读取自身源码。');
  }
}

function importData(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (!d || (!d.cards && !d.rules)) throw new Error('文件格式不正确');
      if (!confirm('导入将覆盖当前数据，确定继续？')) return;
      applyData(d); selected = []; searchText = ''; searchInput.value = ''; editingCardId = editingRuleId = null;
      renderAll(); saveNow(); alert('✅ 导入成功');
    } catch (e) { alert('❌ 导入失败: ' + e.message); }
  };
  fr.readAsText(file);
}

/* ============================================================
   7. 事件（全部委托，重渲染后无需重新绑定）
   ============================================================ */
function setupEvents() {
  // —— 可编辑文本块：输入即自动保存
  document.getElementById('app').addEventListener('input', e => {
    if (e.target.matches('[data-block]')) commit();
  });

  // —— 搜索
  searchInput.addEventListener('input', () => { searchText = searchInput.value; renderAll(); });

  // —— 词条筛选 / 编辑 / 删除
  keywordTags.addEventListener('click', e => {
    const pill = e.target.closest('.tag-pill'); if (!pill) return;
    const kw = pill.dataset.keyword;
    if (kw === '__all') { selected = []; renderAll(); return; }
    const edit = e.target.closest('.tag-edit-btn'), del = e.target.closest('.tag-delete-btn');
    if (edit) return editKeyword(edit.dataset.keyword);
    if (del) return deleteKeyword(del.dataset.keyword);
    if (e.ctrlKey || e.metaKey) {
      const i = selected.indexOf(kw);
      i >= 0 ? selected.splice(i, 1) : selected.push(kw);
    } else {
      selected = (selected.length === 1 && selected[0] === kw) ? [] : [kw];
    }
    renderAll();
  });
  $('clearSelectionBtn').addEventListener('click', () => { selected = []; renderAll(); });
  $('addKeywordBtn').addEventListener('click', addKeyword);

  // —— 规则：编辑 / 删除 / 保存 / 取消
  rulesGrid.addEventListener('click', e => {
    const btn = e.target.closest('button[data-rule-action]'); if (!btn) return;
    const card = btn.closest('.rule-card'); const rule = findRule(card.dataset.id); if (!rule) return;
    switch (btn.dataset.ruleAction) {
      case 'edit': editingRuleId = rule.id; renderAll(); break;
      case 'cancel': editingRuleId = null; renderAll(); break;
      case 'delete': deleteRule(rule.id); break;
      case 'save': {
        const t = card.querySelector('[data-edit-rule="title"]'), d = card.querySelector('[data-edit-rule="description"]');
        if (t) rule.title = t.value.trim() || '未命名规则';
        if (d) rule.description = d.value.trim() || '无描述';
        editingRuleId = null; renderAll(); commit();
        break;
      }
    }
  });
  // 规则编辑态：输入即写入状态并自动保存
  rulesGrid.addEventListener('input', e => {
    const el = e.target.closest('[data-edit-rule]'); if (!el) return;
    const rule = findRule(el.closest('.rule-card').dataset.id); if (!rule) return;
    rule[el.dataset.editRule] = el.value; commit();
  });

  // —— 卡牌：编辑 / 复制 / 删除 / 保存 / 取消
  cardsGrid.addEventListener('click', e => {
    const rm = e.target.closest('[data-remove-keyword]');
    if (rm) return removeKeywordFromCard(rm.closest('.card-item').dataset.id, rm.dataset.removeKeyword);
    const btn = e.target.closest('button[data-action]'); if (!btn) return;
    const id = btn.closest('.card-item').dataset.id;
    switch (btn.dataset.action) {
      case 'edit': editingCardId = id; renderAll(); break;
      case 'cancel-edit': editingCardId = null; renderAll(); break;
      case 'duplicate': duplicateCard(id); break;
      case 'delete': deleteCard(id); break;
      case 'save-edit': {
        const box = btn.closest('.card-item'), c = findCard(id); if (!c) return;
        const get = f => box.querySelector(`[data-edit="${f}"]`);
        c.name = (get('name').value || '').trim() || '未命名';
        c.type = get('type').value || '通用';
        c.effect = (get('effect').value || '').trim() || '无效果';
        c.flavor = (get('flavor').value || '').trim() || '“”';
        editingCardId = null; renderAll(); commit();
        break;
      }
    }
  });
  // 卡牌编辑态：输入即写入状态并自动保存（不重渲染，避免丢失焦点）
  cardsGrid.addEventListener('input', e => {
    const el = e.target.closest('[data-edit]'); if (!el) return;
    const c = findCard(el.closest('.card-item').dataset.id); if (!c) return;
    c[el.dataset.edit] = el.value; commit();
  });
  cardsGrid.addEventListener('change', e => {
    const el = e.target.closest('[data-edit]');
    if (el) {
      const c = findCard(el.closest('.card-item').dataset.id);
      if (c) { c[el.dataset.edit] = el.value; renderAll(); commit(); }
      return;
    }
    const sel = e.target.closest('[data-add-keyword]');
    if (sel && sel.value) addKeywordToCard(sel.closest('.card-item').dataset.id, sel.value);
  });

  // —— 词条 / 行动 提示气泡
  cardsGrid.addEventListener('mouseover', e => {
    const el = e.target.closest('[data-keyword],[data-action]'); if (el) showTooltip(e, el);
  });
  cardsGrid.addEventListener('mousemove', e => { if (tooltip.classList.contains('visible')) moveTooltip(e); });
  cardsGrid.addEventListener('mouseout', e => { if (e.target.closest('[data-keyword],[data-action]')) hideTooltip(); });

  // —— 双击背景故事就地编辑（修改后自动保存）
  document.addEventListener('dblclick', e => {
    const f = e.target.closest('.card-flavor');
    if (!f || editingCardId) return;
    editingCardId = f.closest('.card-item').dataset.id;
    renderAll();
    const input = cardsGrid.querySelector('.card-item.editing [data-edit="flavor"]');
    if (input) { input.focus(); input.select(); }
  });

  // —— 顶部/底部按钮
  $('addCardBtn').addEventListener('click', addCard);
  $('addCardBtnBottom').addEventListener('click', addCard);
  $('addRuleBtn').addEventListener('click', addRule);
  $('clearCardsBtn').addEventListener('click', clearCards);
  $('resetBtn').addEventListener('click', resetDefault);
  $('publishBtn').addEventListener('click', publishStandalone);
  $('exportBtn').addEventListener('click', exportData);
  $('importBtn').addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', () => { if (importFile.files[0]) importData(importFile.files[0]); importFile.value = ''; });

  // —— 跳转到独立场地页
  $('openFieldBtn').addEventListener('click', () => {
    clearTimeout(saveTimer); saveNow();
    window.open('field.html', '_blank');
  });

  // 关闭页面前落盘
  window.addEventListener('beforeunload', () => { clearTimeout(saveTimer); saveNow(); });
}

/* ============================================================
   8. 启动
   ============================================================ */
function init() {
  const hasLocal = loadFromStorage();   // 本地存档优先，避免刷新丢失编辑
  if (!hasLocal) loadDefault();         // 否则使用内嵌默认数据
  renderAll();
  setupEvents();
  if (!hasLocal) saveNow();             // 首次打开：把内嵌数据写入本地，否则场地页读不到卡牌
  setIndicator(hasLocal ? '已载入本地存档' : '已载入默认数据', 'saved');
}

init();
})();
</script>
</body>
</html>
